<!doctype html>
<html lang="ru" data-theme="gruvbox-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2021" />
    <meta
      name="description"
      content="learn-git — интерактивный курс по Git для новичков: теория, практика, симулятор терминала и конфликты."
    />
    <title>learn-git — Git без страха</title>
    <script>
      // Тема и язык ставятся до первой отрисовки: никакой вспышки белым.
      try {
        var settings = JSON.parse(localStorage.getItem('learn-git:settings') || 'null')
        var theme = settings && settings.theme
        var custom = settings && settings.customTheme
        if (theme === 'custom' && custom && custom.colors) {
          var root = document.documentElement
          Object.keys(custom.colors).forEach(function (key) {
            var value = custom.colors[key]
            if (value) root.style.setProperty('--' + key, value)
          })
        } else if (theme) {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
